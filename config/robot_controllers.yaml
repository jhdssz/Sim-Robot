controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

dual_arm_robot_controller:
  type: joint_trajectory_controller/JointTrajectoryController
  joints:
    - left_shoulder_joint
    - left_elbow_joint
    - left_wrist_joint
    - right_shoulder_joint
    - right_elbow_joint
    - right_wrist_joint

  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05

left_arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - left_shoulder_joint
    - left_elbow_joint
    - left_wrist_joint

right_arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - right_shoulder_joint
    - right_elbow_joint
    - right_wrist_joint
